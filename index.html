<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Blue Archive</title>
    <style>
      html {
        background: #4d4d4d var(--wallpaper-cover, url("assets/loading.jpg")) center / cover no-repeat fixed;
        /* The loading frame was captured at a wallpaper scale of 0.7. */
        background-size: calc(max(100vw, 160vh) * var(--wallpaper-scale, 0.8) / 0.7) auto;
        background-position: calc(50% + var(--wallpaper-position-x, 0px)) calc(50% + var(--wallpaper-position-y, 0px));
      }
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        visibility: hidden;
      }
    </style>
    <link rel="preload" href="assets/loading.jpg" as="image">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" type="text/css" href="css/fireworks.css">
    <script src="lib/anime.min.js"></script>
  </head>
  <body>
    <div id='textbox' class='textbox'></div>
    <canvas id="canvas"></canvas>
    <canvas id="overlay" style="position: absolute; top: 0; left: 0; pointer-events: none;"></canvas>
    <script src="lib/spine-webgl-4.2.js"></script>
    <script src="js/main.js"></script>
    <canvas class="fireworks"></canvas>
    <script src="js/fireworks.js"></script>
    <canvas id="ba-pointer-effects" class="fireworks" style="width: 100%; height: 100%;" aria-hidden="true"></canvas>
    <script src="js/ba-pointer.js"></script>
  </body>
</html>
